version: 1
format: both
lang: pt-BR
chunk_size: small
context_watch: off
flowchart: on
context: true
implementer: subagent
scribe: main
tasks_format: md
tasks_autocontinue: on
parallel: off
chunk_order: inside-out
tests: on              # off (padrão): não gera testes automaticamente | on: ao concluir cada feature (ou a correção de um bug-fix), um subagente tester dedicado escreve os testes da funcionalidade — foco em borda e falha, não só caminho feliz — roda e reporta sem corrigir.
auto_commit: full      # full: commita o chunk ao aprovar | suggest-only (padrão): só sugere o comando | off: não menciona git
created: 2026-08-21
